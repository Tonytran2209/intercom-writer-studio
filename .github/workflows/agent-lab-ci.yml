name: Agent Lab CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: agent-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  writer-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run check
      - run: node --test tests/agent-lab/merge-evidence.test.mjs
  browser-tests:
    if: ${{ vars.LAB_BROWSER_TESTS != 'disabled' }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-chromium-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium system dependencies
        timeout-minutes: 3
        run: npx --no-install playwright install-deps chromium
      - name: Prepare Chromium with bounded retry
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 70s npx --no-install playwright install chromium; then
              exit 0
            fi
            echo "Chromium download attempt ${attempt} failed; retrying infrastructure only."
          done
          echo "::error title=CI infrastructure::Chromium download failed before browser tests."
          exit 1
      - run: npx --no-install playwright test --project=${{ matrix.project }} --config playwright.agent-lab.config.mjs --reporter=list,html,./tests/agent-lab/evidence-reporter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-lab-browser-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          overwrite: true
          retention-days: 14
  browser-check:
    needs: browser-tests
    if: ${{ always() && vars.LAB_BROWSER_TESTS != 'disabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-lab-browser-*-${{ github.run_id }}
          path: browser-evidence
      - name: Verify both browser projects and publish evidence
        env:
          SHARDS_RESULT: ${{ needs.browser-tests.result }}
        run: node tests/agent-lab/merge-evidence.mjs browser-evidence

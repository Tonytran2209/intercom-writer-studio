name: Agent Lab CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: agent-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # Metadata only: resolve once, then all jobs checkout the same immutable SHA.
      - uses: actions/github-script@v7
        id: pin
        with:
          script: |
            let sha = context.sha;
            if (context.eventName === 'pull_request') {
              const ref = 'heads/' + context.payload.pull_request.base.ref;
              sha = (await github.rest.git.getRef({...context.repo, ref})).data.object.sha;
            }
            if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('CI contract invalid resolved target SHA');
            core.setOutput('sha', sha);
            core.info('Pinned target CI tools: ' + sha);
  writer-check:
    needs: ci-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned CI tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.ci-tools.outputs.sha }}
          path: .lab-ci-tools
          sparse-checkout: |
            .github/workflows
            tests/agent-lab
          persist-credentials: false
      - name: Verify deployment install contract
        run: node .lab-ci-tools/tests/agent-lab/check-deploy-contract.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run check
      - run: node --test .lab-ci-tools/tests/agent-lab/merge-evidence.test.mjs .lab-ci-tools/tests/agent-lab/infrastructure-retry.test.mjs .lab-ci-tools/tests/agent-lab/sync-baseline-specs.test.mjs .lab-ci-tools/tests/agent-lab/deploy-contract.test.mjs
  browser-tests:
    needs: ci-tools
    if: ${{ vars.LAB_BROWSER_TESTS != 'disabled' }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned CI tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.ci-tools.outputs.sha }}
          path: .lab-ci-tools
          sparse-checkout: |
            .github/workflows
            tests/agent-lab
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify CI configuration
        run: |
          node -e "const v = require('@playwright/test/package.json').version; if (v !== '1.64.1') throw Error('Playwright image/package mismatch: ' + v)"
      - name: Verify pinned Playwright environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          node -e "require('@playwright/test').chromium.launch().then(browser => browser.close())"
      - name: Refresh unchanged baseline browser specs
        env:
          CI_BASE_SHA: ${{ needs.ci-tools.outputs.sha }}
        run: node .lab-ci-tools/tests/agent-lab/sync-baseline-specs.mjs
      - name: Run browser tests
        run: npx --no-install playwright test --project=${{ matrix.project }} --config playwright.agent-lab.config.mjs --reporter=list,html,./.lab-ci-tools/tests/agent-lab/evidence-reporter.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-lab-browser-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          overwrite: true
          retention-days: 14
  browser-check:
    needs: [browser-tests, ci-tools]
    if: ${{ always() && vars.LAB_BROWSER_TESTS != 'disabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned CI tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.ci-tools.outputs.sha }}
          path: .lab-ci-tools
          sparse-checkout: |
            .github/workflows
            tests/agent-lab
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-lab-browser-*-${{ github.run_id }}
          path: browser-evidence
      - name: Verify both browser projects and publish evidence
        env:
          SHARDS_RESULT: ${{ needs.browser-tests.result }}
        run: node .lab-ci-tools/tests/agent-lab/merge-evidence.mjs browser-evidence
